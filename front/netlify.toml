"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "."

# Rutas limpias del frontend
[[redirects]]
  from = "/metodos"
  to = "/metodos.html"
  status = 200

# Proxy API hacia Supabase Edge Functions (proyecto dedicado mineria -> NeonDB)
[[redirects]]
  from = "/api/*"
  to = "https://veakptgthvcqyoomwjdv.supabase.co/functions/v1/autogest-api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"
